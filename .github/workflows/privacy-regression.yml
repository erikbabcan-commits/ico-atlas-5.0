name: Privacy and TLS regression
on: [push, pull_request]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install pytest==9.0.2 fastapi==0.128.2 requests==2.32.5 beautifulsoup4==4.14.3
      - run: python -m pytest -q tests/test_log_privacy.py
