services:
  postgres:
    image: postgres:16-alpine
    container_name: whoiswho_postgres
    environment:
      POSTGRES_DB: whoiswho
      POSTGRES_USER: whoiswho
      POSTGRES_PASSWORD: whoiswho_dev
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U whoiswho -d whoiswho"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: whoiswho_api
    environment:
      APP_ENV: local
      APP_DEBUG: "false"
      # V produkcii nastav vlastný kľúč: openssl rand -base64 32
      APP_KEY: base64:REPLACE_WITH_OWN_APP_KEY
      WHOISWHO_API_KEY: dev-local-key
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: whoiswho
      DB_USERNAME: whoiswho
      DB_PASSWORD: whoiswho_dev
      CACHE_STORE: database
      SESSION_DRIVER: array
      LOG_CHANNEL: stderr
    ports:
      - "8000:80"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  postgres_data:
